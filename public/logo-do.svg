<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Radiant Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="25%" stop-color="#F5CE62" />
      <stop offset="50%" stop-color="#E5A93C" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996515" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1813" />
      <stop offset="70%" stop-color="#0B0B0E" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <!-- Gold Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Outer Concentric Golden Ring with Accents -->
  <circle cx="256" cy="236" r="168" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="14 8" stroke-opacity="0.6" />
  <circle cx="256" cy="236" r="154" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldGlow)" />
  <circle cx="256" cy="236" r="144" fill="#0C0C10" fill-opacity="0.8" />

  <!-- Monogram DO Interlocked Luxury Crest -->
  <g filter="url(#goldGlow)">
    <!-- Letter 'D' -->
    <path d="M 180 148 L 226 148 C 268 148 296 178 296 236 C 296 294 268 324 226 324 L 180 324 Z M 216 182 L 216 290 L 228 290 C 250 290 264 270 264 236 C 264 202 250 182 228 182 Z" fill="url(#goldGrad)" />
    
    <!-- Letter 'O' Intertwined (offset to the right) -->
    <path d="M 286 168 C 326 168 356 198 356 236 C 356 274 326 304 286 304 C 274 304 262 300 252 292 C 258 280 262 264 263 246 C 263 226 259 210 253 198 C 263 178 274 168 286 168 Z M 286 198 C 280 198 275 204 272 216 C 277 223 279 232 279 242 C 279 252 277 260 273 268 C 276 273 281 276 286 276 C 298 276 308 262 308 236 C 308 210 298 198 286 198 Z" fill="url(#goldGleam)" fill-opacity="0.95" />
    
    <!-- Diamond/Star Sparkle Top Right of Crest -->
    <path d="M 346 138 Q 352 148 362 154 Q 352 160 346 170 Q 340 160 330 154 Q 340 148 346 138 Z" fill="#FFFBEB" />
  </g>

  <!-- Typography at bottom: DIMARIA COMPANY & OPPORTUNITY -->
  <text x="256" y="420" font-family="'Cinzel', serif" font-size="28" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">DIMARIA</text>
  <text x="256" y="446" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#E5C07B" text-anchor="middle" letter-spacing="4">OPPORTUNITY</text>
  
  <line x1="160" y1="462" x2="352" y2="462" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.7" />
  <text x="256" y="478" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#9CA3AF" text-anchor="middle" letter-spacing="2">BY DIMARIA COMPANY</text>
</svg>
